<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Market Prices — Yahoo Finance WebSocket</title>

  <style>
    :root {
      --bg:#101820; --card:#202d38; --line:#2c3d4b;
      --text:#ffffff; --muted:#b7c4cf; --accent:#65c8ff;
      --up:#26c281; --down:#e8544a; --wait:#e8b93b;
    }

    * { box-sizing: border-box; }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }

    h2 { color: var(--accent); margin: 0 0 12px; }
    h3 { color: var(--accent); font-size: 15px; margin: 24px 0 8px; }

    .status {
      padding: 12px 14px;
      border-radius: 8px;
      background: var(--card);
      margin-bottom: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px 22px;
      align-items: center;
      font-size: 14px;
    }
    .status strong { color: #fff; }

    .dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: #888; display: inline-block; margin-right: 6px;
    }
    .dot.on   { background: var(--up); }
    .dot.off  { background: var(--down); }
    .dot.wait { background: var(--wait); }

    .toolbar { margin-bottom: 16px; }

    button {
      padding: 11px 18px;
      border: none;
      border-radius: 6px;
      margin: 0 6px 0 0;
      cursor: pointer;
      font-size: 14px;
    }
    #connectBtn    { background: #1687e8; color: #fff; }
    #disconnectBtn { background: #d84343; color: #fff; }
    button:disabled { opacity: .45; cursor: not-allowed; }

    #prices {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(265px, 1fr));
      gap: 12px;
    }

    .price-card {
      background: var(--card);
      border: 1px solid var(--line);
      padding: 14px 16px;
      border-radius: 8px;
      transition: opacity .2s;
    }
    .price-card.stale { opacity: .55; }

    .row {
      display: flex; justify-content: space-between;
      align-items: baseline; gap: 8px;
    }

    .symbol { font-size: 17px; font-weight: bold; letter-spacing: .5px; }

    .badge {
      font-size: 10px; padding: 2px 7px; border-radius: 10px;
      background: #0d151c; color: var(--muted); border: 1px solid var(--line);
      white-space: nowrap;
    }

    .name { color: var(--muted); font-size: 11.5px; margin-top: 3px; min-height: 14px; }

    .price {
      font-size: 26px; font-weight: bold; margin: 9px 0 6px;
      font-variant-numeric: tabular-nums;
    }
    .price.up   { color: var(--up); }
    .price.down { color: var(--down); }

    .details {
      color: var(--muted); font-size: 13px; line-height: 1.75;
      font-variant-numeric: tabular-nums;
    }
    .details span { color: #e7eef5; }

    #logs {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      background: #080d12;
      padding: 12px;
      border-radius: 6px;
      font-size: 12px;
      max-height: 220px;
      overflow-y: auto;
      font-family: ui-monospace, Consolas, monospace;
    }
  </style>
</head>

<body>

  <h2>Live Market Prices</h2>

  <div class="status">
    <div><span id="dot" class="dot off"></span>Connection: <strong id="status">Disconnected</strong></div>
    <div>Symbols live: <strong id="liveCount">0</strong> / <span id="totalCount">0</span></div>
    <div>Last message: <strong id="lastMsg">--</strong></div>
    <div>Stats: <strong id="stats">0 frames</strong></div>
  </div>

  <div class="toolbar">
    <button id="connectBtn">Connect</button>
    <button id="disconnectBtn">Disconnect</button>
  </div>

  <div id="prices"></div>

  <h3>Connection Logs</h3>
  <div id="logs">Ready to connect.</div>

  <script>
  /* =========================================================
     1. SETTINGS
     ========================================================= */

  const YH_URL = "wss://streamer.finance.yahoo.com/?version=2";
  const SILENCE_MS   = 12000;   // no tick this long -> try next Yahoo symbol
  const HEARTBEAT_MS = 15000;   // re-send subscribe so Yahoo keeps streaming

  // Static contract specs — these never change, they are NOT prices.
  const MARKET = [
    { sym:'EURUSD', name:'Euro vs US Dollar',                digits:5, price:1.11990, spread:1,   contract:100000, usdBase:false },
    { sym:'GBPUSD', name:'Great Britain Pound vs US Dollar', digits:5, price:1.33708, spread:0,   contract:100000, usdBase:false },
    { sym:'USDCHF', name:'US Dollar vs Swiss Franc',         digits:5, price:0.82218, spread:2,   contract:100000, usdBase:true  },
    { sym:'USDJPY', name:'US Dollar vs Japanese Yen',        digits:3, price:157.003, spread:2,   contract:100000, usdBase:true  },
    { sym:'USDCNH', name:'US Dollar vs Chinese Yuan',        digits:5, price:6.67385, spread:12,  contract:100000, usdBase:true  },
    { sym:'AUDUSD', name:'Australian Dollar vs US Dollar',   digits:5, price:0.70078, spread:1,   contract:100000, usdBase:false },
    { sym:'NZDUSD', name:'New Zealand Dollar vs US Dollar',  digits:5, price:0.56781, spread:1,   contract:100000, usdBase:false },
    { sym:'USDCAD', name:'US Dollar vs Canadian Dollar',     digits:5, price:1.40362, spread:1,   contract:100000, usdBase:true  },
    { sym:'USDSEK', name:'US Dollar vs Swedish Krona',       digits:5, price:9.92560, spread:100, contract:100000, usdBase:true  },
    { sym:'XAUUSD', name:'Gold vs US Dollar',                digits:2, price:2650.00, spread:25,  contract:100,    usdBase:false }
  ];

  // Yahoo tickers to try, in order. Yahoo does NOT send an error for a bad
  // ticker, it just stays silent — so the silence timer below moves on.
  const YH_CANDIDATES = {
    EURUSD: ['EURUSD=X'],
    GBPUSD: ['GBPUSD=X'],
    USDCHF: ['CHF=X'],
    USDJPY: ['JPY=X'],
    USDCNH: ['CNH=X', 'CNY=X'],
    AUDUSD: ['AUDUSD=X'],
    NZDUSD: ['NZDUSD=X'],
    USDCAD: ['CAD=X'],
    USDSEK: ['SEK=X'],
    XAUUSD: ['XAUUSD=X', 'GC=F']
  };


  /* =========================================================
     2. MARKET STATE
     ========================================================= */

  const MAP   = {};
  const Q     = {};
  const BY_YH = {};   // 'EURUSD=X' -> 'EURUSD'

  Object.keys(YH_CANDIDATES).forEach(sym => {
    YH_CANDIDATES[sym].forEach(t => { BY_YH[t] = sym; });
  });

  MARKET.forEach(m => {
    m.point = Math.pow(10, -m.digits);
    m.tv    = YH_CANDIDATES[m.sym][0];   // active Yahoo ticker (kept as .tv for the UI)
    MAP[m.sym] = m;
    Q[m.sym] = {
      bid: m.price,
      ask: +(m.price + m.spread * m.point).toFixed(m.digits),
      open: null, lo: null, hi: null, ch: null, chp: null,
      dir: 0, time: null, live: false, delayed: false
    };
  });


  /* =========================================================
     3. APP STATE + FEED + LOG
     ========================================================= */

  const State = {
    watchlist: MARKET.map(m => m.sym),
    journal:   [],
    attempts:  {},
    tvSymbols: {},
    lastTickAt:{},       // sym -> ms timestamp of last real tick
    ticks:     {},       // sym -> tick count
    stats: { frames: 0, pricing: 0, other: 0, decodeErrors: 0, unknownIds: 0 }
  };
  MARKET.forEach(m => { State.tvSymbols[m.sym] = m.tv; State.ticks[m.sym] = 0; });

  const DEBUG = new URLSearchParams(location.search).has('debug');
  let rawShown = 0;

  function log(msg) {
    const t = new Date();
    State.journal.unshift({ t, msg });
    if (State.journal.length > 500) State.journal.length = 500;
    const el = document.getElementById('logs');
    el.textContent += '\n' + t.toLocaleTimeString() + ' ' + msg;
    el.scrollTop = el.scrollHeight;
  }
  log('Terminal started (Yahoo Finance feed)');

  const Feed = {
    subs: new Set(),
    on(fn) { this.subs.add(fn); return () => this.subs.delete(fn); },
    emit() { this.subs.forEach(fn => fn()); }
  };

  let renderQueued = false;
  function scheduleRender() {
    if (renderQueued) return;
    renderQueued = true;
    requestAnimationFrame(() => { renderQueued = false; Feed.emit(); });
  }


  /* =========================================================
     4. PROTOBUF DECODER  (Yahoo PricingData, no libraries)
     ========================================================= */

  function b64ToBytes(b64) {
    const bin = atob(b64);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  // Field number -> [name, kind]. kind: s=string f=float32 d=double z=sint64 i=int
  const PD = {
    1:['id','s'], 2:['price','f'], 3:['time','z'], 4:['currency','s'], 5:['exchange','s'],
    6:['quoteType','i'], 7:['marketHours','i'], 8:['changePercent','f'], 9:['dayVolume','z'],
    10:['dayHigh','f'], 11:['dayLow','f'], 12:['change','f'], 13:['shortName','s'],
    15:['openPrice','f'], 16:['previousClose','f'], 23:['bid','f'], 24:['bidSize','z'],
    25:['ask','f'], 26:['askSize','z'], 27:['priceHint','z']
  };

  function decodePricing(bytes) {
    const dv  = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
    const dec = new TextDecoder();
    const out = {};
    let pos = 0;

    function varint() {
      let result = 0n, shift = 0n;
      while (true) {
        if (pos >= bytes.length) throw new Error('truncated varint');
        const b = bytes[pos++];
        result |= BigInt(b & 0x7f) << shift;
        if (!(b & 0x80)) break;
        shift += 7n;
      }
      return result;
    }

    while (pos < bytes.length) {
      const tag   = Number(varint());
      const field = tag >> 3;
      const wire  = tag & 7;
      const def   = PD[field];
      let val;

      if (wire === 0) {                       // varint
        const v = varint();
        val = (def && def[1] === 'z') ? Number((v >> 1n) ^ -(v & 1n)) : Number(v);
      } else if (wire === 1) {                // 64-bit
        val = dv.getFloat64(pos, true); pos += 8;
      } else if (wire === 2) {                // length-delimited
        const len = Number(varint());
        val = dec.decode(bytes.subarray(pos, pos + len)); pos += len;
      } else if (wire === 5) {                // 32-bit
        val = dv.getFloat32(pos, true); pos += 4;
      } else {
        throw new Error('unsupported wire type ' + wire);
      }

      if (def) out[def[0]] = val;
    }
    return out;
  }


  /* =========================================================
     5. CONNECT / DISCONNECT
     ========================================================= */

  let ws = null, manualClose = false, reconnectTimer = null, reconnectTries = 0;
  let lastMessageAt = null, heartbeatTimer = null, silenceTimer = null, openedAt = 0;

  function send(obj) {
    if (!ws || ws.readyState !== WebSocket.OPEN) { log('Cannot send: socket not open.'); return false; }
    ws.send(JSON.stringify(obj));
    return true;
  }

  function activeTickers() { return MARKET.map(m => State.tvSymbols[m.sym]); }

  function connect() {
    if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
      log('Already connected or connecting.'); return;
    }
    clearTimeout(reconnectTimer);
    manualClose = false;
    State.attempts = {};
    State.lastTickAt = {};
    MARKET.forEach(m => { m.tv = YH_CANDIDATES[m.sym][0]; State.tvSymbols[m.sym] = m.tv; });

    setStatus('Connecting', 'wait');
    log('Connecting to ' + YH_URL + ' …');

    try { ws = new WebSocket(YH_URL); }
    catch (err) { setStatus('Error', 'off'); log('Connection error: ' + err.message); return; }

    ws.addEventListener('open', () => {
      reconnectTries = 0;
      openedAt = Date.now();
      setStatus('Connected', 'on');
      log('WebSocket opened.');

      const subs = activeTickers();
      send({ subscribe: subs });
      log('Subscribed: ' + subs.join(', '));

      clearInterval(heartbeatTimer);
      heartbeatTimer = setInterval(() => send({ subscribe: activeTickers() }), HEARTBEAT_MS);

      clearInterval(silenceTimer);
      silenceTimer = setInterval(checkSilence, 3000);
    });

    ws.addEventListener('message', e => handleMessage(e.data));
    ws.addEventListener('error', () => log('WebSocket error (see browser console, Network tab → WS).'));

    ws.addEventListener('close', e => {
      ws = null;
      clearInterval(heartbeatTimer); clearInterval(silenceTimer);
      setStatus('Disconnected', 'off');
      log('Connection closed. Code: ' + e.code + (e.reason ? ' reason: ' + e.reason : ''));
      MARKET.forEach(m => { Q[m.sym].live = false; });
      scheduleRender();

      if (!manualClose && reconnectTries < 10) {
        reconnectTries++;
        log('Reconnecting in 5s (attempt ' + reconnectTries + '/10)…');
        reconnectTimer = setTimeout(connect, 5000);
      }
    });
  }

  function disconnect() {
    manualClose = true;
    clearTimeout(reconnectTimer);
    clearInterval(heartbeatTimer); clearInterval(silenceTimer);
    if (ws) { ws.close(); ws = null; }
    setStatus('Disconnected', 'off');
    MARKET.forEach(m => { Q[m.sym].live = false; });
    log('Disconnected by user.');
    scheduleRender();
  }

  // Yahoo never reports bad tickers — detect them by silence instead.
  function checkSilence() {
    const now = Date.now();
    if (now - openedAt < SILENCE_MS) return;

    MARKET.forEach(m => {
      const last = State.lastTickAt[m.sym];
      const quiet = now - (last || openedAt);
      if (quiet > SILENCE_MS) {
        Q[m.sym].live = false;
        // Only rotate ticker if it has NEVER ticked (market closed ≠ bad ticker).
        if (!State.ticks[m.sym]) tryNextCandidate(m.sym);
      }
    });
    scheduleRender();
  }

  function tryNextCandidate(sym) {
    const list = YH_CANDIDATES[sym];
    const next = (State.attempts[sym] || 0) + 1;
    if (next >= list.length) return;   // nothing left; stay quiet, don't spam log

    State.attempts[sym] = next;
    const t = list[next];
    MAP[sym].tv = t;
    State.tvSymbols[sym] = t;
    State.lastTickAt[sym] = Date.now();   // restart this symbol's silence clock
    log('No ticks for ' + sym + ' — trying ' + t);
    send({ subscribe: [t] });
  }


  /* =========================================================
     6. PROCESS MESSAGES
     ========================================================= */

  function toNum(v) {
    if (v === null || v === undefined || v === '') return null;
    const n = typeof v === 'number' ? v : Number(v);
    return Number.isFinite(n) ? n : null;
  }

  function handleMessage(raw) {
    State.stats.frames++;

    if (DEBUG && rawShown < 5) { rawShown++; log('RAW: ' + String(raw).slice(0, 300)); }

    let env;
    try { env = JSON.parse(raw); }
    catch { State.stats.other++; if (rawShown < 5) log('Non-JSON frame: ' + String(raw).slice(0, 120)); updateStats(); return; }

    if (env.type !== 'pricing' || !env.message) {
      State.stats.other++;
      log('Non-pricing message: ' + JSON.stringify(env).slice(0, 200));
      updateStats(); return;
    }

    let d;
    try { d = decodePricing(b64ToBytes(env.message)); }
    catch (err) {
      State.stats.decodeErrors++;
      log('Decode error: ' + err.message);
      updateStats(); return;
    }

    State.stats.pricing++;
    if (DEBUG && State.stats.pricing <= 5) log('DECODED: ' + JSON.stringify(d));

    handleQuote(d);
    updateStats();
  }

  function handleQuote(d) {
    const sym = BY_YH[d.id];
    if (!sym) { State.stats.unknownIds++; if (State.stats.unknownIds <= 3) log('Tick for unexpected id: ' + d.id); return; }

    const m = MAP[sym], q = Q[sym];
    const prevMid = (q.bid != null && q.ask != null) ? (q.bid + q.ask) / 2 : null;

    const price = toNum(d.price);
    const bid = toNum(d.bid), ask = toNum(d.ask);

    // proto3 omits zero values; treat 0 as "not sent"
    if (bid > 0)        q.bid = bid;
    else if (price > 0) q.bid = price;

    if (ask > 0)        q.ask = ask;
    else if (q.bid != null) q.ask = q.bid + m.spread * m.point;

    const mid = (q.bid + q.ask) / 2;
    if (prevMid != null && Math.abs(mid - prevMid) > 1e-12) q.dir = mid > prevMid ? 1 : -1;

    if (d.openPrice > 0) q.open = d.openPrice;
    if (d.dayHigh > 0)   q.hi = d.dayHigh;
    else if (q.hi == null || q.ask > q.hi) q.hi = q.ask;
    if (d.dayLow > 0)    q.lo = d.dayLow;
    else if (q.lo == null || q.bid < q.lo) q.lo = q.bid;

    if (d.change != null)        q.ch  = d.change;
    if (d.changePercent != null) q.chp = d.changePercent;

    q.time = d.time ? new Date(d.time) : new Date();   // Yahoo time is epoch ms
    q.live = true;

    State.lastTickAt[sym] = Date.now();
    State.ticks[sym]++;
    lastMessageAt = new Date();
    scheduleRender();
  }

  function updateStats() {
    const s = State.stats;
    document.getElementById('stats').textContent =
      s.frames + ' frames · ' + s.pricing + ' ticks · ' + s.decodeErrors + ' decode errors';
  }


  /* =========================================================
     7. DISPLAY PRICES
     ========================================================= */

  function fmt(v, digits) { return (v == null || !isFinite(v)) ? '--' : Number(v).toFixed(digits); }
  function fmtSigned(v, digits) {
    if (v == null || !isFinite(v)) return '--';
    return (v > 0 ? '+' : '') + Number(v).toFixed(digits);
  }

  function renderPrices() {
    const container = document.getElementById('prices');
    let liveCount = 0;

    container.innerHTML = State.watchlist.map(sym => {
      const m = MAP[sym], q = Q[sym], d = m.digits;
      if (q.live) liveCount++;

      const mid = (q.bid != null && q.ask != null) ? (q.bid + q.ask) / 2 : (q.bid != null ? q.bid : q.ask);
      const dirClass = q.dir > 0 ? 'up' : (q.dir < 0 ? 'down' : '');
      const spreadPts = (q.bid != null && q.ask != null) ? Math.round((q.ask - q.bid) / m.point) : null;
      const tickTime = q.time ? q.time.toLocaleTimeString() : '--';

      return `
        <div class="price-card${q.live ? '' : ' stale'}">
          <div class="row">
            <div class="symbol">${m.sym}</div>
            <div class="badge">${State.tvSymbols[sym] || m.tv} · ${State.ticks[sym]} ticks</div>
          </div>
          <div class="name">${m.name}</div>
          <div class="price ${dirClass}">${fmt(mid, d)}</div>
          <div class="details">
            Bid <span>${fmt(q.bid, d)}</span><br>
            Ask <span>${fmt(q.ask, d)}</span><br>
            Spread <span>${spreadPts == null ? '--' : spreadPts + ' pts'}</span><br>
            Change <span>${fmtSigned(q.ch, d)} (${fmtSigned(q.chp, 2)}%)</span><br>
            H / L <span>${fmt(q.hi, d)} / ${fmt(q.lo, d)}</span><br>
            Tick <span>${tickTime}</span>
          </div>
        </div>`;
    }).join('');

    document.getElementById('liveCount').textContent = liveCount;
    document.getElementById('lastMsg').textContent = lastMessageAt ? lastMessageAt.toLocaleTimeString() : '--';
  }

  function setStatus(text, cls) {
    document.getElementById('status').textContent = text;
    document.getElementById('dot').className = 'dot ' + (cls || 'off');
  }

  Feed.on(renderPrices);
  document.getElementById('totalCount').textContent = MARKET.length;
  document.getElementById('connectBtn').addEventListener('click', connect);
  document.getElementById('disconnectBtn').addEventListener('click', disconnect);
  renderPrices();
  connect();   // auto-connect; remove if you prefer manual start

  </script>

</body>
</html>
